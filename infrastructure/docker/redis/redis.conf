
# ==========================================
# NETWORK
# ==========================================

bind 0.0.0.0
port 6379
protected-mode yes


# ==========================================
# PERSISTENCE
# ==========================================

# Enable Append Only File persistence
appendonly yes

# Save writes to disk every second
appendfsync everysec

# Snapshot settings
save 900 1
save 300 10
save 60 10000

# Data directory
dir /data

# Snapshot filename
dbfilename dump.rdb


# ==========================================
# MEMORY
# ==========================================

# Do not automatically evict queue data
maxmemory-policy noeviction


# ==========================================
# LOGGING
# ==========================================

loglevel notice
