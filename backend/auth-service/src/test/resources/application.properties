spring.application.name=auth-service
spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=lineless
spring.datasource.password=devpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.private-key-location=file:C:/practice/lineless/infrastructure/secrets/jwt-private.pem
app.jwt.public-key-location=file:C:/practice/lineless/infrastructure/secrets/jwt-public.pem
app.jwt.issuer=https://lineless-auth
app.jwt.audience=lineless-api
app.jwt.access-token-expiration=900
app.jwt.refresh-token-expiration=604800

app.oauth.google.client-id=test-google-client
app.oauth.google.issuer=https://accounts.google.com
app.oauth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

app.auth.refresh-cookie.name=lineless_refresh
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.http-only=true
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax

spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=devpassword
spring.data.redis.timeout=2s

app.cors.allowed-origins=http://localhost:3000

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.frontend.base-url=http://localhost:3000
app.mail.from=noreply@lineless.local
