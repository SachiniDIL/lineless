spring.application.name=auth-service

server.port=8083

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.profiles.active=dev

spring.jpa.open-in-view=false

# JWT configuration
app.jwt.issuer=${JWT_ISSUER:https://lineless-auth}
app.jwt.audience=lineless-api
app.jwt.access-token-expiration=900

app.oauth.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth.google.issuer=https://accounts.google.com
app.oauth.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}

# Initial admin account
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.name=${ADMIN_BOOTSTRAP_NAME:}
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}