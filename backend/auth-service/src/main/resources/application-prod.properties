spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.private-key-location=${JWT_PRIVATE_KEY_PATH}
app.jwt.public-key-location=${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.audience=${JWT_AUDIENCE}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800}

app.oauth.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth.google.issuer=https://accounts.google.com
app.oauth.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}

app.auth.refresh-cookie.name=${REFRESH_COOKIE_NAME:lineless_refresh}
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.http-only=true
app.auth.refresh-cookie.secure=true
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.timeout=2s

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}
app.frontend.base-url=${FRONTEND_BASE_URL}

app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.name=${ADMIN_BOOTSTRAP_NAME:}
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.health.mail.enabled=false
