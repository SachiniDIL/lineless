spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# JWT key locations
app.jwt.private-key-location=${JWT_PRIVATE_KEY_PATH}
app.jwt.public-key-location=${JWT_PUBLIC_KEY_PATH}

app.jwt.refresh-token-expiration=604800

# Refresh token cookie configuration
app.auth.refresh-cookie.name=lineless_refresh
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.http-only=true
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax

# Local email testing with Mailpit
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application email settings
app.frontend.base-url=http://localhost:3000
app.mail.from=noreply@lineless.local
