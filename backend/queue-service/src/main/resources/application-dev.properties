spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/queue_db}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:lineless}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:devpassword}}

spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6380}}
spring.data.redis.password=${REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:devpassword}}
spring.data.redis.timeout=2s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
