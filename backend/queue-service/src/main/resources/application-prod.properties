spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:${SPRING_DATA_REDIS_HOST}}
spring.data.redis.port=${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD}}
spring.data.redis.timeout=2s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS}}
